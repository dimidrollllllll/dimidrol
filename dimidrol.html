<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>dimidrol</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; }

    #intro {
        position: fixed;
        inset: 0;
        z-index: 2;
        cursor: pointer;
        overflow: hidden;
        transition: opacity 0.6s ease 0.5s;
    }

    #intro img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1);
        transition: transform 1.1s ease-in;

        /* ============================================================
           УЛУЧШЕНИЕ КАЧЕСТВА ФОТО ПРИ МАСШТАБИРОВАНИИ
           ============================================================ */
        image-rendering: -webkit-optimize-contrast; /* Chrome, Safari */
        image-rendering: crisp-edges;               /* Firefox */
        backface-visibility: hidden;                /* убирает размытие */
        -webkit-backface-visibility: hidden;
        transform: translateZ(0);                   /* включает GPU-сглаживание */
        will-change: transform;                     /* готовит браузер к зуму */
    }

    #intro.hidden img {
        transform: scale(2.2); /* было 2.8 — уменьшил, чтобы меньше мылило */
    }
    #intro.hidden {
        opacity: 0;
        pointer-events: none;
    }

    #about {
        position: fixed;
        inset: 0;
        z-index: 1;
        background: #000;
        color: #d8d4cc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px;
        opacity: 0;
        transition: opacity 0.7s ease 0.6s;
    }

    #about.show { opacity: 1; }

    #about h1 {
        font-size: 48px;
        letter-spacing: 6px;
        margin-bottom: 25px;
        color: #d8d4cc;
        font-weight: normal;
    }

    #about p {
        font-size: 18px;
        line-height: 1.8;
        color: #a8a29a;
        max-width: 600px;
    }
</style>
</head>
<body>

    <div id="intro" onclick="goInside()">
        <img src="pictures.jpg" alt="">
    </div>

    <div id="about">
        <h1>dimidrol</h1>
        <p>Здесь будет текст обо мне.</p>
    </div>

    <script>
        function goInside() {
            document.getElementById('intro').classList.add('hidden');
            document.getElementById('about').classList.add('show');
        }
    </script>

</body>
</html>
